name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: npm ci
        working-directory: tool
      - run: npm test
        working-directory: tool

  # routeguard on its own fixture app, which is vulnerable on purpose: the scan must find things
  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          path: tool/test/fixtures/app
      - name: Expect findings
        if: steps.scan.outcome != 'failure'
        run: |
          echo "routeguard found nothing in a deliberately vulnerable app"
          exit 1
